{% extends "base.html" %}

{% block title %}Login - Financeiro Familiar{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-wallet"></i>
            </div>
            <h1 class="login-title">Bem-vindo de volta</h1>
            <p class="login-subtitle">Entre para gerenciar suas finanças</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div style="position: relative;">
                        <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray);"></i>
                        <input type="text" name="username" class="form-control" placeholder="Seu username" required style="padding-left: 42px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray);"></i>
                        <input type="password" name="password" class="form-control" placeholder="Sua senha" required style="padding-left: 42px;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
            </form>

            <div class="login-link">
                <p>Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre sua família</a></p>
                <!--<p style="margin-top: 10px;"><a href="{{ url_for('forgot_password') }}">Esqueceu a senha?</a></p>-->
            </div>
        </div>
    </div>
</div>
{% endblock %}
